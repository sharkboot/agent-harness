[workspace]
members = ["crates/harness-event", "crates/harness-session", "crates/harness-runtime"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["sharkboot"]
license = "MIT"
description = "Agent Harness — 连接 LLM 与执行环境的运行框架"

[workspace.dependencies]
harness-event  = { path = "crates/harness-event" }
harness-session = { path = "crates/harness-session" }
harness-runtime = { path = "crates/harness-runtime" }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
uuid        = { version = "1", features = ["v4", "serde"] }
tracing     = "0.1"
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
chrono      = { version = "0.4", features = ["serde"] }
